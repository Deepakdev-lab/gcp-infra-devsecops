name: Terraform Network Security

on:
  pull_request:
    paths:
      - "02-network-security/**"
      - ".github/workflows/terraform-network-security.yml"
  push:
    branches:
      - main
    paths:
      - "02-network-security/**"
      - ".github/workflows/terraform-network-security.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation to run after planning
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-network-security
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_WORKING_DIR: 02-network-security
  TF_VAR_backend_image: ${{ vars.GCP_BACKEND_IMAGE }}
  TF_VAR_ui_image: ${{ vars.GCP_UI_IMAGE }}

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform format check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ "${{ github.event.inputs.operation }}" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: 02-network-security/tfplan
          retention-days: 5

  apply:
    name: Terraform apply
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'apply' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: terraform-apply
      url: https://console.cloud.google.com/home/dashboard?project=${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download approved Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: 02-network-security

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan

  destroy:
    name: Terraform destroy
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'destroy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: terraform-destroy
      url: https://console.cloud.google.com/home/dashboard?project=${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false

      - name: Download Terraform destroy plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: 02-network-security

      - name: Terraform destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false tfplan