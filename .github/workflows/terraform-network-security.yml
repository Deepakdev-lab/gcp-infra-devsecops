name: Terraform Network Security

on:
  pull_request:
    paths:
      - "02-network-security/**"
      - ".github/workflows/terraform-network-security.yml"

  push:
    branches:
      - main
    paths:
      - "02-network-security/**"
      - ".github/workflows/terraform-network-security.yml"

  workflow_dispatch:
    inputs:
      operation:
        description: "Terraform operation to run after planning"
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-network-security
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_WORKING_DIR: "02-network-security"

  TF_VAR_backend_image: "${{ vars.GCP_BACKEND_IMAGE || 'us-east4-docker.pkg.dev/project-a95e6dc6-f7fc-4043-bf9/cloudrun-images/backend:d717e2b00656369bdc62e68660b7f29efe235a3d' }}"

  TF_VAR_ui_image: "${{ vars.GCP_UI_IMAGE || 'us-east4-docker.pkg.dev/project-a95e6dc6-f7fc-4043-bf9/cloudrun-images/ui:d717e2b00656369bdc62e68660b7f29efe235a3d' }}"


jobs:

  # ============================================================
  # TERRAFORM PLAN + SECURITY SCAN
  # ============================================================

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout Terraform source
      # ----------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # TERRAFORM IaC SECURITY SCAN
      # ----------------------------------------------------------
      #
      # What does this scan do?
      #
      # Trivy analyzes the Terraform files as Infrastructure-as-Code.
      #
      # It looks for security misconfigurations such as:
      #
      #   - Publicly exposed resources
      #   - Overly permissive firewall rules
      #   - 0.0.0.0/0 access
      #   - Public storage
      #   - Excessive IAM permissions
      #   - Missing encryption/security settings
      #   - Insecure networking configuration
      #   - Other Terraform security weaknesses
      #
      # IMPORTANT:
      #
      # This is a READ-ONLY security scan.
      #
      # It does NOT:
      #
      #   - terraform apply
      #   - create GCP resources
      #   - modify GCP resources
      #   - delete GCP resources
      #
      # Terraform validate:
      #   "Is my Terraform configuration valid?"
      #
      # Trivy:
      #   "Is my Terraform configuration secure?"
      #
      # ----------------------------------------------------------

      - name: Security scan - Terraform IaC misconfiguration
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "config"
          scan-ref: "02-network-security"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "table"
          ignore-unfixed: true


      # ----------------------------------------------------------
      # GCP AUTHENTICATION
      # ----------------------------------------------------------
      #
      # GitHub Actions authenticates to GCP using Workload
      # Identity Federation.
      #
      # No service-account JSON key is stored in GitHub.
      #
      # ----------------------------------------------------------

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}"


      # ----------------------------------------------------------
      # TERRAFORM SETUP
      # ----------------------------------------------------------

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"


      # ----------------------------------------------------------
      # TERRAFORM FORMAT CHECK
      # ----------------------------------------------------------
      #
      # Checks Terraform formatting.
      #
      # This is not a security scanner.
      #
      # ----------------------------------------------------------

      - name: Terraform format check
        working-directory: "${{ env.TF_WORKING_DIR }}"
        run: terraform fmt -check -recursive


      # ----------------------------------------------------------
      # TERRAFORM INIT
      # ----------------------------------------------------------
      #
      # Initializes Terraform providers and backend/state.
      #
      # ----------------------------------------------------------

      - name: Terraform init
        working-directory: "${{ env.TF_WORKING_DIR }}"
        run: terraform init -input=false


      # ----------------------------------------------------------
      # NORMALIZE CLOUD RUN STATE ADDRESSES
      # ----------------------------------------------------------

      - name: Normalize Cloud Run state addresses
        working-directory: "${{ env.TF_WORKING_DIR }}"
        shell: bash
        run: |
          move_state() {
            source_address="$1"
            target_address="$2"

            if terraform state list | grep -Fqx "$source_address"; then
              terraform state mv "$source_address" "$target_address"
            fi
          }

          move_state 'google_cloud_run_v2_service.backend[0]' 'google_cloud_run_v2_service.backend'
          move_state 'google_cloud_run_v2_service.ui[0]' 'google_cloud_run_v2_service.ui'
          move_state 'google_cloud_run_v2_service_iam_member.backend_public[0]' 'google_cloud_run_v2_service_iam_member.backend_public'
          move_state 'google_cloud_run_v2_service_iam_member.ui_public[0]' 'google_cloud_run_v2_service_iam_member.ui_public'


      # ----------------------------------------------------------
      # TERRAFORM VALIDATE
      # ----------------------------------------------------------
      #
      # Checks Terraform syntax and configuration validity.
      #
      # Examples:
      #
      #   - Invalid Terraform syntax
      #   - Invalid resource attributes
      #   - Invalid expressions
      #   - Configuration errors
      #
      # This is NOT a security scanner.
      #
      # ----------------------------------------------------------

      - name: Terraform validate
        working-directory: "${{ env.TF_WORKING_DIR }}"
        run: terraform validate


      # ----------------------------------------------------------
      # CHECK APPLICATION IMAGE VARIABLES
      # ----------------------------------------------------------

      - name: Check application image variables
        if: "${{ github.event_name != 'workflow_dispatch' || github.event.inputs.operation != 'destroy' }}"
        run: |
          test -n "$TF_VAR_backend_image" || {
            echo "GCP_BACKEND_IMAGE is empty or missing"
            exit 1
          }

          test -n "$TF_VAR_ui_image" || {
            echo "GCP_UI_IMAGE is empty or missing"
            exit 1
          }

          echo "Backend image: $TF_VAR_backend_image"
          echo "UI image: $TF_VAR_ui_image"


      # ----------------------------------------------------------
      # TERRAFORM PLAN
      # ----------------------------------------------------------
      #
      # Terraform plan shows what Terraform WOULD change.
      #
      # It does NOT apply the changes.
      #
      # + = resource creation
      # ~ = resource modification
      # - = resource destruction
      #
      # ----------------------------------------------------------

      - name: Terraform plan
        working-directory: "${{ env.TF_WORKING_DIR }}"
        shell: bash
        run: |
          if [ "${{ github.event.inputs.operation }}" = "destroy" ]; then
            terraform plan \
              -destroy \
              -input=false \
              -out=tfplan
          else
            terraform plan \
              -input=false \
              -out=tfplan
          fi


      # ----------------------------------------------------------
      # UPLOAD TERRAFORM PLAN
      # ----------------------------------------------------------
      #
      # Stores the exact generated plan as an artifact.
      #
      # The apply/destroy job later downloads this plan.
      #
      # ----------------------------------------------------------

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: "02-network-security/tfplan"
          retention-days: 5


  # ============================================================
  # TERRAFORM APPLY
  # ============================================================
  #
  # This is the job that ACTUALLY changes GCP infrastructure.
  #
  # It only runs after the plan job succeeds.
  #
  # ============================================================

  apply:
    name: Terraform apply
    needs: plan

    if: "${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'apply')) }}"

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4


      # GCP authentication is required for Terraform apply.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}"


      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"


      - name: Terraform init
        working-directory: "${{ env.TF_WORKING_DIR }}"
        run: terraform init -input=false


      # Download the exact plan created by the plan job.
      - name: Download approved Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: "02-network-security"


      # ========================================================
      # ACTUAL INFRASTRUCTURE CHANGE
      # ========================================================
      #
      # This command actually changes GCP infrastructure.
      #
      - name: Terraform apply
        working-directory: "${{ env.TF_WORKING_DIR }}"
        run: terraform apply -input=false tfplan


  # ============================================================
  # TERRAFORM DESTROY
  # ============================================================

  destroy:
    name: Terraform destroy
    needs: plan

    if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'destroy' && github.ref == 'refs/heads/main' }}"

    runs-on: ubuntu-latest

    environment:
      name: terraform-destroy
      url: "https://console.cloud.google.com/home/dashboard?project=${{ vars.GCP_PROJECT_ID }}"


    steps:

      - name: Check out repository
        uses: actions/checkout@v4


      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_TERRAFORM_SERVICE_ACCOUNT }}"


      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"


      - name: Terraform init
        working-directory: "${{ env.TF_WORKING_DIR }}"
        run: terraform init -input=false


      - name: Download Terraform destroy plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: "02-network-security"


      # ========================================================
      # ACTUAL INFRASTRUCTURE DESTRUCTION
      # ========================================================
      #
      # This command actually destroys the resources described
      # by the destroy plan.
      #
      - name: Terraform destroy
        working-directory: "${{ env.TF_WORKING_DIR }}"
        run: terraform apply -input=false tfplan
